backend = "xrender";
vsync = true;

shadow = true;
shadow-radius = 26;
shadow-opacity = 0.42;
shadow-offset-x = -24;
shadow-offset-y = -18;

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

corner-radius = 12;
detect-rounded-corners = true;
detect-client-opacity = true;

rules = (
  { match = "window_type = 'dock' || window_type = 'desktop' || class_g = 'conky' || class_g = 'Mingo-dock'";
    shadow = false; corner-radius = 0; },
  { match = "window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || class_g = 'Rofi'";
    corner-radius = 10; },
  { match = "class_g = 'Tint2'"; corner-radius = 0; shadow = false; }
);

# Apple-like motion: windows zoom in/out softly, moves and resizes glide
animations = (
  { triggers = [ "open", "show" ]; preset = "appear"; duration = 0.22; scale = 0.9; },
  { triggers = [ "close", "hide" ]; preset = "disappear"; duration = 0.16; scale = 0.92; },
  { triggers = [ "geometry" ]; preset = "geometry-change"; duration = 0.2; }
);
