backend = "xrender";
vsync = false;
shadow = true;
shadow-radius = 18;
shadow-opacity = 0.45;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-exclude = [ "class_g = 'conky'", "class_g = 'Tint2'", "window_type = 'desktop'" ];
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
corner-radius = 8;
rounded-corners-exclude = [ "class_g = 'Tint2'", "class_g = 'conky'", "window_type = 'desktop'" ];
detect-rounded-corners = true;
detect-client-opacity = true;
