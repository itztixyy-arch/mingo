-- Mingo desktop widget (top right)
conky.config = {
  alignment = 'top_right',
  gap_x = 28, gap_y = 28,
  minimum_width = 270, maximum_width = 270,
  own_window = true,
  own_window_type = 'normal',
  own_window_argb_visual = true,
  own_window_argb_value = 0,
  own_window_transparent = true,
  own_window_class = 'conky',
  own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
  double_buffer = true,
  use_xft = true,
  font = 'DejaVu Sans:size=10',
  update_interval = 2,
  default_color = 'd8e2ec',
  color1 = '5aa9e6',
  color2 = '7f93a6',
  draw_shades = false,
  draw_outline = false,
  border_width = 0,
  default_bar_height = 6,
};

conky.text = [[
${color1}${font DejaVu Sans:bold:size=40}${time %H:%M}${font}${color}
${color2}${time %A, %d %B %Y}${color}

${color1}CPU${color}   ${cpu}%
${cpubar 6}
${color1}RAM${color}   ${mem} / ${memmax}
${membar 6}
${color1}Space${color} ${fs_free /} free in RAM
${color1}Net${color}   ${execi 10 ip -4 -o addr show scope global | awk '{print $2" "$4}' | head -1}
${color1}Up${color}    ${uptime_short}
${color1}Saved${color} version ${execi 30 cat /mnt/mingo/mingo/current-version.txt 2>/dev/null || echo -}  ${color2}(USB ${fs_free /mnt/mingo} free)${color}
]];
