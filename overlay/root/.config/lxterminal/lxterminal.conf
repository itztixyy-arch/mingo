[general]
fontname=DejaVu Sans Mono 11
selchars=-A-Za-z0-9,./?%&#:_~
scrollback=10000
bgcolor=rgb(14,24,34)
fgcolor=rgb(216,226,236)
palette_color_0=rgb(29,39,51)
palette_color_1=rgb(224,108,117)
palette_color_2=rgb(152,195,121)
palette_color_3=rgb(229,192,123)
palette_color_4=rgb(90,169,230)
palette_color_5=rgb(198,120,221)
palette_color_6=rgb(86,182,194)
palette_color_7=rgb(216,226,236)
palette_color_8=rgb(75,93,112)
palette_color_9=rgb(255,123,134)
palette_color_10=rgb(174,227,138)
palette_color_11=rgb(245,214,140)
palette_color_12=rgb(125,192,245)
palette_color_13=rgb(217,143,240)
palette_color_14=rgb(111,208,220)
palette_color_15=rgb(255,255,255)
color_preset=Custom
disallowbold=false
boldbright=false
cursorblinks=true
cursorunderline=false
audiblebell=false
visualbell=false
tabpos=top
geometry_columns=100
geometry_rows=30
hidescrollbar=true
hidemenubar=true
hideclosebutton=false
hidepointer=false
disablef10=true
disablealt=false
disableconfirm=true

[shortcut]
new_window_accel=<Primary><Shift>n
new_tab_accel=<Primary><Shift>t
close_tab_accel=<Primary><Shift>w
close_window_accel=<Primary><Shift>q
copy_accel=<Primary><Shift>c
paste_accel=<Primary><Shift>v
zoom_in_accel=<Primary>plus
zoom_out_accel=<Primary>minus
zoom_reset_accel=<Primary>0
